name: "Build Container"

on:
  pull_request:
    branches: [ "trunk" ]

  push:
    branches: [ "trunk" ]

jobs:
  build-push-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with: { name: proteomics, skipPush: true }

      - name: Container Registry Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container
        run: nix build --print-build-logs .#container

      - name: Push Container to GHCR
        if: ${{ github.event.pull_request.merged == true }}
        run: |
          docker image load < result
          docker tag proteomics.nix:latest ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix:latest
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proteomics.nix:latest
